[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-claude-kit"
version = "0.1.0"
description = "Governance + orchestration framework wrapping the Anthropic Claude API for enterprise deployments"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sairaj Boddula", email = "sairajboddula@gmail.com" }]

requires-python = ">=3.11"
keywords = ["anthropic", "claude", "enterprise", "governance", "llm", "ai", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=0.40.0",
  "pydantic>=2.0",
  "aiosqlite>=0.19",
  "typer>=0.12",
  "rich>=13.0",
  "python-dotenv>=1.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
ecl = "enterprise_claude.cli:app"

[project.urls]
Homepage = "https://github.com/enterprise-claude-kit/enterprise-claude-kit"
Documentation = "https://enterprise-claude-kit.readthedocs.io"
"Bug Tracker" = "https://github.com/enterprise-claude-kit/enterprise-claude-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["enterprise_claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
